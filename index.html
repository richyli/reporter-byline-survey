<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>記者署名研究（測試版）</title>
<style>
  /* WSJ／彭博風：黑白極簡、細襯線、印刷版報紙感。無金色、無漸層、無圓角光暈。 */
  :root{
    --bg:#f7f6f3;          /* 極淺暖灰（報紙白）*/
    --paper:#ffffff;       /* 卡片純白 */
    --ink:#16140f;         /* 墨黑字 */
    --sub:#6b6862;         /* 次要灰 */
    --line:#d8d4cc;        /* 細線（hairline）*/
    --rule:#16140f;        /* 報頭粗線（黑）*/
    --sel:#16140f;         /* 選中＝黑邊 */
    --selbg:#f0eee9;       /* 選中底（極淡灰）*/
    --accent:#8a1f1f;      /* 克制酒紅（僅用於極少數強調，如 trap）*/
    --card-w:820px;        /* 上下比較：卡片加寬到桌機大部分 byline 單行不斷行（約容 45 字）；手機仍 100% 縮 */
    --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;}
  .wrap{max-width:920px;margin:0 auto;padding:10px 14px 28px;}
  /* 報頭：粗黑上下線 + 襯線刊名 */
  .masthead{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:3px;
    text-align:center;padding:8px 0;margin:0 0 14px;text-transform:none;
    border-top:2px solid var(--rule);border-bottom:1px solid var(--rule)}
  h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:.1em 0 .5em;
     letter-spacing:.3px;color:var(--ink);line-height:1.3}
  h2{font-family:var(--serif);font-size:18px;margin:1.1em 0 .5em;color:var(--ink)}
  p{margin:.55em 0} .sub{color:var(--sub);font-size:14px}
  .sig{font-family:var(--serif);color:var(--sub);font-size:13px;letter-spacing:2px;
       margin-top:20px;border-top:1px solid var(--line);padding-top:10px;text-align:right}
  .panel{background:var(--paper);border:1px solid var(--line);padding:20px;margin:14px 0}
  .btn{display:inline-block;border:1px solid var(--ink);padding:12px 26px;font-size:16px;font-weight:700;
    cursor:pointer;background:var(--ink);color:#fff;transition:.12s;letter-spacing:1px}
  .btn:hover{background:#000}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink)}
  .progress{height:2px;background:var(--line);overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
  .trial-panel{padding:8px 4px;margin:6px 0;display:flex;flex-direction:column;gap:12px}
  .trial-head{flex:0 0 auto}
  .trial-topline{display:flex;align-items:center;gap:12px}
  .trial-topline .small{flex:0 0 auto;white-space:nowrap;font-family:var(--serif);text-transform:uppercase;letter-spacing:1px}
  .trial-topline .progress{flex:1 1 auto}
  .prompt{font-family:var(--serif);font-size:19px;font-weight:700;text-align:center;margin:6px 0 2px;line-height:1.45}
  .prompt.trap{color:var(--accent);animation:flash 1s linear infinite}
  /* 情境錨點（媒體名／新聞類型）：實驗操弄的關鍵情境詞，需讓受訪者確實注意到。
     用酒紅字＋淡底標示，克制不搶戲、與 trap 的閃爍紅區隔（此處不閃、不加框）。 */
  .ctx{color:var(--accent);background:rgba(138,31,31,.07);padding:1px 5px;border-radius:2px;white-space:nowrap}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
  .trial-body{display:flex;flex-direction:column;gap:16px}
  .nextrow{display:flex;justify-content:center}
  .nextrow .btn{min-width:200px}
  /* 上下比較（桌機與手機皆同）：兩卡縱向堆疊、置中，方便上下對照閱讀 */
  .pair{display:flex;flex-direction:column;gap:16px;justify-content:center;align-items:center}
  /* 文字卡：白紙黑字、細黑框、選中＝粗黑框 + 淡灰底（無光暈無位移）*/
  .opt{width:100%;max-width:min(var(--card-w),94vw);border:1px solid var(--line);
    cursor:pointer;background:var(--paper);transition:.12s;position:relative;
    padding:22px 20px 20px;display:flex;flex-direction:column}
  .opt:hover{border-color:#9a958c}
  .opt.sel{border:2px solid var(--sel);background:var(--selbg);padding:21px 19px 19px}
  .opt .lab{position:absolute;top:-11px;left:18px;background:var(--paper);color:var(--ink);
    font-family:var(--serif);font-size:13px;font-weight:700;padding:1px 10px;letter-spacing:1px;border:1px solid var(--line)}
  .opt.sel .lab{background:var(--ink);color:#fff;border-color:var(--ink)}
  .opt .lab.trap{background:var(--accent);color:#fff;border-color:var(--accent);white-space:nowrap;animation:flash 1s linear infinite}
  .opt .chk{position:absolute;top:10px;right:12px;font-size:18px;font-weight:900;color:var(--ink);display:none}
  .opt.sel .chk{display:block}
  .opt .byline{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink)}
  /* 姓名非屬性，淺灰低調不搶內文 */
  .opt .byname{font-weight:700;font-size:15px;color:#9a958c;letter-spacing:.5px}
  .scale{display:flex;gap:5px;justify-content:space-between}
  .scale label{flex:1 1 0;text-align:center;cursor:pointer}
  .scale input{display:none}
  .scale .dot{display:block;border:1px solid var(--line);padding:10px 0;font-size:15px;background:var(--paper);transition:.1s}
  .scale input:checked + .dot{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px}
  .field{margin:18px 0} .field > label{display:block;font-size:15px;margin-bottom:7px;font-weight:600;line-height:1.5}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .opts label{border:1px solid var(--line);padding:8px 16px;cursor:pointer;background:var(--paper);font-size:14px}
  .opts input{display:none}
  .opts label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .grp-intro{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);
    border-bottom:1px solid var(--rule);padding:0 0 6px;margin:22px 0 10px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .small{font-size:13px;color:var(--sub)}
  .mobile-hint{display:none;text-align:center;color:var(--sub);font-size:13px;margin:-2px 0 6px}
  .hide{display:none!important}
  @media (max-width:560px){
    .pair{flex-direction:column;gap:14px}
    .opt{max-width:100%;width:100%}
    .nextrow{position:sticky;bottom:8px;z-index:5}
    .nextrow .btn{width:100%;padding:15px;font-size:18px;box-shadow:0 -2px 12px rgba(0,0,0,.12)}
    .mobile-hint{display:block}
    .scale .dot{padding:9px 0;font-size:14px}
    .prompt{font-size:17px;margin:6px 0}
    .opt .byline{font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">
<div id="errbox" style="display:none;background:#3a1212;border:1px solid #a33;color:#ffd;padding:10px 14px;border-radius:8px;margin:10px 0;font-size:13px;white-space:pre-wrap"></div>

<!-- 1. 研究說明（正式版首頁） -->
<section id="screen-intro" class="panel">
  <div class="masthead">記者署名研究</div>
  <p>接下來請想像你正在網路上閱讀一則<span class="ctx">財經新聞</span>，在報導的標題與內文中間你會看到記者的署名與簡介。</p>
  <p>本研究分兩部分，每題<b>上下呈現</b>兩位虛構的記者資歷簡介，請依你的<b>第一直覺</b>作答最適合的，沒有對錯，整個研究只要大約 4 分鐘。</p>
  <p class="small">本研究使用虛構記者，姓名與資歷組合皆為隨機產生，與真實人物無關；作答匿名，不收集個人姓名與聯絡方式，僅供學術研究，分析時也不會以個人為分析單位。您可以隨時退出。</p>
  <button class="btn" id="btn-intro-next">我同意開始研究</button>
  <div class="sig">政大新聞　李怡志</div>
</section>

<!-- 2. 任務前導 -->
<section id="screen-taskintro" class="panel hide">
  <h1 id="task-title">開始作答</h1>
  <p id="task-desc"></p>
  <button class="btn" id="btn-task-next">開始</button>
</section>

<!-- 3. 對比題（trial / trap / repeat 共用畫面） -->
<section id="screen-trial" class="hide">
  <div class="panel trial-panel">
    <div class="trial-head">
      <div class="trial-topline">
        <span class="small" id="trial-counter"></span>
        <div class="progress"><i id="trial-bar"></i></div>
      </div>
      <div class="prompt" id="trial-prompt"></div>
      <div class="mobile-hint">點選任一張卡片即可選取</div>
    </div>
    <div class="trial-body">
      <div class="pair">
        <div class="opt" data-side="L" id="opt-L"><span class="lab">A</span><span class="chk">✓</span><div class="byline" id="by-L"></div></div>
        <div class="opt" data-side="R" id="opt-R"><span class="lab">B</span><span class="chk">✓</span><div class="byline" id="by-R"></div></div>
      </div>
      <div class="nextrow"><button class="btn" id="btn-trial-next" disabled>下一題</button></div>
    </div>
  </div>
</section>

<!-- 4. 量表 -->
<section id="screen-survey" class="panel hide">
  <h1>最後幾個問題</h1>
  <p class="sub">以下請依你的整體感受與實際情況作答。</p>
  <form id="survey-form"></form>
  <div class="nav"><span></span><button class="btn" id="btn-survey-next" disabled>送出</button></div>
  <div class="sig">政大新聞 李怡志</div>
</section>

<!-- 5. 完成 -->
<section id="screen-done" class="panel hide">
  <h1>完成 ✓</h1>
  <p id="done-msg"></p>
  <div id="done-actions"></div>
  <div class="sig">政大新聞　李怡志</div>
</section>

</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const show = id => { document.querySelectorAll('section').forEach(s=>s.classList.add('hide')); $(id).classList.remove('hide'); window.scrollTo(0,0); };
// 把任何未捕捉錯誤直接顯示在畫面上（除錯用，避免「按了沒反應」查不到原因）
window.addEventListener('error', e=>{
  const box=document.getElementById('errbox');
  if(box){ box.style.display='block'; box.textContent='⚠ JS 錯誤：'+e.message+' @ '+(e.filename||'').split('/').pop()+':'+e.lineno; }
});
const DEFAULT_ENDPOINT = 'https://api.sheetmonkey.io/form/8utmWimsSuNDoEiVFz8Cyb';   // R Reporter Byline 專屬 form

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// config.js 是否成功載入（防止外部 script 未載入時整個 inline 腳本在 STATE 初始化就拋錯、導致所有按鈕失效）
const CONFIG_OK = (typeof DESIGN !== 'undefined') && (typeof ATTRS !== 'undefined') && (typeof TASKS !== 'undefined');
const STATE = {
  pid:'P'+Math.floor(performance.now()*1000).toString(36)+Math.floor(Math.random()*1e6).toString(36),
  startedAt:new Date().toISOString(),
  endpoint: DEFAULT_ENDPOINT,
  nTrialsPerTask: CONFIG_OK ? DESIGN.nTrialsPerTask : 6,
  minAnswerSec: CONFIG_OK ? DESIGN.minAnswerSec : 3,
  outlet:null,            // between-subject：整份固定一家媒體
  taskOrder:[],           // 雙 DV 任務呈現順序（counterbalance）
  chunkOrder:[],          // 受訪者內固定塊順序（edu + 4 solo）
  seq:[], seqIdx:0, shownAt:0, gateTimer:null, current:null,
  responses:[], traps:[], repeats:[], survey:{},
};
// 若 config.js 沒載到，明確告知而非靜默讓按鈕無反應
if(!CONFIG_OK){ window.addEventListener('DOMContentLoaded', ()=>{
  const box=document.getElementById('errbox');
  if(box){ box.style.display='block'; box.textContent='⚠ 設定檔（config.js）未載入，請重新整理頁面（Ctrl/⌘+Shift+R 強制重載）。若持續發生請回報。'; }
}); }

/* ---- 配對產生：7 屬性（school/degree/tenure/rank/cred/beat/award，2026-07-17 定稿）----
 * minimal overlap + 互有勝負。規則（SoT §9）：左右至少 N-3 屬性不同（7 屬性→≥4）；
 * 對「強度屬性」（cred 證照 / tenure 年資 / award 得獎）要求互有勝負（A 至少一個 > B、B 也至少一個 > A），
 * 排除一面倒 dominated。其餘類別屬性（school/degree/rank/beat）只計「不同」數。
 * 另：年資×職級禁制組合（prohibited）+ 配對內長度匹配（字長差≤8、子句數相等）。
 */
/* 強度屬性（供互有勝負/dominance，皆為信號成本軸有序屬性）：
 *   證照 cred(1無<2高業<3分析師)、年資 tenure(1不提<2=3年<3=10年<4=20年)、得獎 award(1不提<2國內<3國外)。
 * ordered idx 數值作強度排序（含「不提」非純線性但 idx 可比）。award 2026-07-17 加入。 */
const STRENGTH = ['cred','tenure','award'];
const MIN_DIFF = ATTR_KEYS.length - 3;                       // 7-3 = 4
/* 年資×職級禁制組合（使用者/conjoint-expert 定）：太資淺不可能有資深頭銜、太資深不會掛資淺頭銜。
 * tenure idx:1不提 2=3年 3=10年 4=20年 ; rank idx:1不提 2記者 3資深（砍主編 2026-06-20）
 * 禁制：3年×資深、20年×記者。「不提年資」配任何職級皆合理。 */
function prohibited(p){
  const t=p.tenure, r=p.rank;
  if(t===2 && r===3) return true;   // 3年 × 資深
  if(t===4 && r===2) return true;   // 20年 × 記者
  return false;
}
/* 「不提」數量上限（使用者 2026-07-17）：每張卡最多 3 項不提，保證至少揭露 4/7 項資歷，
 * 避免出現幾乎空白的卡（原模擬最多可不提 5 項、平均 2.28）。
 * 各屬性的「不提」水準 idx：school=3, degree=3, cred=1, tenure=1, rank=1, beat=1, award=1 */
const OMIT_IDX = { school:3, degree:3, cred:1, tenure:1, rank:1, beat:1, award:1 };
const MAX_OMIT = 3;
function nOmitted(p){ return ATTR_KEYS.reduce((n,k)=>n+(p[k]===OMIT_IDX[k]?1:0),0); }
function tooEmpty(p){ return nOmitted(p) > MAX_OMIT; }
function randProfile(){ let p,g=0; do{ p={}; ATTRS.forEach(a=>{ p[a.key]=rand(a.levels).idx; }); g++; }while((prohibited(p)||tooEmpty(p))&&g<500); return p; }
function diffCount(A,B){ return ATTR_KEYS.reduce((n,k)=>n+(A[k]!==B[k]?1:0),0); }
function strengthWins(A,B){ return STRENGTH.some(k=>A[k]>B[k]); } // A 在某強度屬性嚴格大於 B
function identical(A,B){ return ATTR_KEYS.every(k=>A[k]===B[k]); }
/* 長度平衡（配對內長度匹配，防 count heuristic + 防 attribute overlap 降 D-eff，conjoint_book §2.9）：
 * 可見子句數 = 學歷塊(0/1) + 路線職級塊(0/1) + 非「不提」的 cred + tenure + award。子句數相等→行數一致。
 * 只約束「子句數相等 + 字長差≤8」，不強制特定屬性成對不提（避免兩卡多屬性同時不提造成 overlap）。 */
function eduVisible(p){ return buildEduChunk(p)?1:0; }
function roleVisible(p){ return buildRoleChunk(p)?1:0; }
function visibleClauses(p){ return eduVisible(p)+roleVisible(p)+(p.cred!==1?1:0)+(p.tenure!==1?1:0)+(p.award!==1?1:0); }
function bodyLen(p){ return buildSentenceBody(p, CHUNK_KEYS, p.credVar, p.awardVar).length; }  // 帶證照/得獎長度版本
/* solo 子句長度微調：cred 與 award 皆有 phraseVariants（同義不同長度）。
 * 搜尋兩卡的 credVar × awardVar 版本組合使字長差最小，存進 .credVar / .awardVar。
 * 版本純為長度服務、不進設計矩陣（part-worth 只對應水準 idx），不洩漏資訊。 */
function nVariants(key, idx){
  const lv = ATTRS.find(a=>a.key===key).levels.find(l=>l.idx===idx);
  return (lv && lv.phraseVariants && lv.phraseVariants.length) || 1;
}
function tuneCredLen(A,B){
  let best=null, bestDiff=Infinity;
  for(let i=0;i<nVariants('cred',A.cred);i++) for(let j=0;j<nVariants('cred',B.cred);j++)
  for(let m=0;m<nVariants('award',A.award);m++) for(let n=0;n<nVariants('award',B.award);n++){
    A.credVar=i; B.credVar=j; A.awardVar=m; B.awardVar=n;
    const d=Math.abs(bodyLen(A)-bodyLen(B));
    if(d<bestDiff){ bestDiff=d; best=[i,j,m,n]; }
  }
  if(best){ A.credVar=best[0]; B.credVar=best[1]; A.awardVar=best[2]; B.awardVar=best[3]; }
  return bestDiff;
}
/* 長度匹配組：兩卡等長（子句數相等 + 字長差≤8，必要時用證照版本微調）→ 估純內容 part-worth。 */
function makePairMatched(){
  let A,B,guard=0;
  do{
    A=randProfile(); B=randProfile(); A.credVar=null; B.credVar=null; A.awardVar=null; B.awardVar=null; guard++;
    if(identical(A,B) || diffCount(A,B)<MIN_DIFF || !strengthWins(A,B) || !strengthWins(B,A) || visibleClauses(A)!==visibleClauses(B)) continue;
    tuneCredLen(A,B);                                       // 證照版本微調縮小長度差
    if(Math.abs(bodyLen(A)-bodyLen(B))<=8) break;           // 微調後仍須 ≤8
  } while(guard<15000);
  return Math.random()<.5 ? [A,B] : [B,A];
}
/* 長度不限組：捕捉「長>短(揭露多寡)」效果，但長短差不可過大（使用者 2026-07-17）。
 * 仍要求：非 identical、diff≥MIN_DIFF、互有勝負（避免 dominated）。
 * 長度差約束：子句數差恰為 1（保證有差但不誇張）+ 字數差 ≤ MAX_FREE_LEN_DIFF
 * （原無上限時字數差平均 10.7、最大 30，過大會使長卡明顯「看起來資歷豐富」而蓋過屬性效果）。 */
const MAX_FREE_LEN_DIFF = 12;
function makePairFree(){
  let A,B,guard=0;
  do{ A=randProfile(); B=randProfile(); A.credVar=null; B.credVar=null; A.awardVar=null; B.awardVar=null; guard++; }
  while(guard<15000 && (
    identical(A,B) ||
    diffCount(A,B) < MIN_DIFF ||
    !strengthWins(A,B) || !strengthWins(B,A) ||
    Math.abs(visibleClauses(A)-visibleClauses(B)) !== 1 ||   // 子句數差恰 1 → 有長度差但不誇張
    Math.abs(bodyLen(A)-bodyLen(B)) > MAX_FREE_LEN_DIFF      // 字數差上限
  ));
  return Math.random()<.5 ? [A,B] : [B,A];
}
/* 相容舊呼叫：預設用匹配組 */
function makePair(){ return makePairMatched(); }
/* dominance holdout：一卡所有強度屬性皆 ≥、且至少一個 >，非強度屬性相同 → 理性必選優卡。
 * 先讓 lo 的強度屬性「不為最高」，再令 hi=lo+1；需通過禁制檢查。 */
function makeDominancePair(){
  let lo,hi,g=0;
  do{
    lo=randProfile();
    STRENGTH.forEach(k=>{ const mx=ATTRS.find(a=>a.key===k).levels.length; if(lo[k]>=mx) lo[k]=1+Math.floor(Math.random()*(mx-1)); });
    hi={...lo}; STRENGTH.forEach(k=>{ hi[k]=lo[k]+1; }); // 每個強度屬性 +1 → hi 全面嚴格優
    g++;
  }while((prohibited(lo)||prohibited(hi))&&g<200);
  const winnerIsL = Math.random()<.5;
  return winnerIsL ? {pair:[hi,lo], winSide:'L'} : {pair:[lo,hi], winSide:'R'};
}

function assignName(used){ let n; let g=0; do{ n=rand(NAME_POOL); g++; }while(used.has(n)&&g<50); used.add(n); return n; }

/* 每題抽一個媒體（within-subject：題內兩位同家、題間隨機） */
/* between-subject：整份固定一家媒體（進場分派 STATE.outlet）。
 * 每個 item 仍帶 .outlet 以沿用渲染/flatten 邏輯，但全程同一家、題間不切換（降認知負荷）。 */
function pickOutlet(){ return STATE.outlet; }

/* ---- 建立單一 DV 任務的子序列 ----
 * n 題 trial + 1 trap（第1題後，trap 各 DV 指定不同邊）+ 1 dominance + 1 鏡像 repeat。
 * 每個 item 自帶 task（read/wary）與 outlet（題內同家）。
 */
/* 每 DV：nMatched 題長度匹配組 + nFree 題長度不限組（標 lenGroup），打散排序。
 * 品質題分散（使用者 2026-06-20）：DV1(read)放 trap、DV2(wary)放 repeat、皆不放 dominance。 */
function buildTaskSeq(taskKey, used){
  const n = STATE.nTrialsPerTask;                 // 10
  const nM = (CONFIG_OK && DESIGN.nMatched) || 6;
  const nF = (CONFIG_OK && DESIGN.nFree) || 4;
  const trials = [];
  let ti=0;
  for(let i=0;i<nM;i++){ const [A,B]=makePairMatched(); trials.push({ kind:'trial', task:taskKey, trial:ti++, lenGroup:'matched', A, B, nameA:assignName(used), nameB:assignName(used), outlet:pickOutlet() }); }
  for(let i=0;i<nF;i++){ const [A,B]=makePairFree();    trials.push({ kind:'trial', task:taskKey, trial:ti++, lenGroup:'free',    A, B, nameA:assignName(used), nameB:assignName(used), outlet:pickOutlet() }); }
  shuffle(trials);                                // matched/free 打散；trial 序號保留原值供配對追蹤
  trials.forEach((t,idx)=>{ t.pos=idx; });

  // 品質題：read→trap、wary→repeat（分散，省題數）
  let qItem=null;
  if(taskKey==='read'){
    const [ta,tb]=makePairMatched();
    qItem={ kind:'trap', task:taskKey, A:ta, B:tb, nameA:assignName(used), nameB:assignName(used), expectSide:'L', outlet:pickOutlet() };
  } else {
    // 鏡像 repeat：取中後段一題（避開第1題 warm-up），左右鏡像重現
    const repSrcIdx = n>=3 ? (1+Math.floor(Math.random()*(n-2))) : Math.max(0,n-1);
    const src = trials.find(t=>t.trial===repSrcIdx) || trials[trials.length-1];
    qItem = { kind:'repeat', task:taskKey, ofTrial:src.trial,
      A:src.B, B:src.A, nameA:src.nameB, nameB:src.nameA, outlet:src.outlet };
  }

  const seq=[];
  seq.push(trials[0]);
  seq.push(qItem);                                // 品質題插在第1題後
  for(let i=1;i<trials.length;i++) seq.push(trials[i]);
  return seq;
}

/* 全序列：兩個 DV 任務串接（順序已 counterbalance） */
function buildSequence(){
  const used = new Set();
  STATE.seq = STATE.taskOrder.flatMap(tk => buildTaskSeq(tk, used));
}

function progressPct(){ return Math.min(100, STATE.seqIdx/STATE.seq.length*100); }

/* ---- 流程 ---- */
// 正式版：研究說明為首頁，按「開始作答」即初始化並進入第一個任務。
$('#btn-intro-next').onclick = ()=>{
  STATE.chunkOrder = shuffle(CHUNK_KEYS);
  // between-subject 媒體：整份固定一家（進場隨機分派，全程不變）
  STATE.outlet = rand(OUTLETS);
  // 雙 DV 任務順序隨機（使用者 2026-06-20 指定；每位受訪者隨機決定 read/wary 先後）
  const flip = Math.random() < 0.5;
  STATE.taskOrder = flip ? ['wary','read'] : ['read','wary'];
  buildSequence();
  STATE.taskStarts = {};
  STATE.taskOrder.forEach(tk=>{ STATE.taskStarts[tk] = STATE.seq.findIndex(it=>it.task===tk); });
  STATE.seqIdx=0; gotoCurrentOrTaskIntro();
};

// 在每個 DV 任務的第一題前插入該任務前導
function gotoCurrentOrTaskIntro(){
  const item = STATE.seq[STATE.seqIdx];
  if(item && STATE.taskStarts[item.task]===STATE.seqIdx){
    const t = TASKS[item.task];
    $('#task-title').textContent = t.title;
    $('#task-desc').innerHTML = t.intro;
    show('#screen-taskintro');
  } else { showItem(); }
}
$('#btn-task-next').onclick = ()=>{ showItem(); };

function showItem(){
  const item = STATE.seq[STATE.seqIdx];
  STATE.current = { ...item, chosenSide:null };
  const outlet = item.outlet.name;
  const t = TASKS[item.task];
  // 還原卡片標籤（非 trap 一律純 A/B）
  $('#opt-L .lab').textContent='A'; $('#opt-R .lab').textContent='B';
  $('#opt-L .lab').classList.remove('trap'); $('#opt-R .lab').classList.remove('trap');
  if(item.kind==='trap'){
    const sideLabel = item.expectSide==='L' ? 'A' : 'B';
    $('#trial-prompt').innerHTML = `【注意力檢查】本題不需比較，請直接點選標示「${sideLabel}」的那一張卡片。`;
    $('#trial-prompt').classList.add('trap');
    $('#trial-counter').textContent = '注意力檢查';
    // 警語同時出現在按鈕（目標卡標籤）上
    const tgt = item.expectSide==='L' ? '#opt-L .lab' : '#opt-R .lab';
    $(tgt).textContent = `${sideLabel}　← 請點這張`;
    $(tgt).classList.add('trap');
  } else {
    $('#trial-prompt').innerHTML = t.prompt.replaceAll('{OUTLET}', outlet);
    $('#trial-prompt').classList.remove('trap');
    $('#trial-counter').textContent = t.title;
  }
  // 渲染敘述句：姓名粗體 + 學歷塊與 solo 子句依 chunkOrder 排序
  $('#by-L').innerHTML = `<span class="byname">${item.nameA}</span>` + buildSentenceBody(item.A, STATE.chunkOrder, item.A.credVar, item.A.awardVar);
  $('#by-R').innerHTML = `<span class="byname">${item.nameB}</span>` + buildSentenceBody(item.B, STATE.chunkOrder, item.B.credVar, item.B.awardVar);
  $('#opt-L').classList.remove('sel'); $('#opt-R').classList.remove('sel');
  $('#btn-trial-next').disabled = true;
  if(STATE.gateTimer){ clearInterval(STATE.gateTimer); STATE.gateTimer=null; }
  $('#btn-trial-next').textContent='下一題';
  $('#trial-bar').style.width = progressPct()+'%';
  STATE.shownAt = performance.now();
  show('#screen-trial');
}

function choose(side){
  STATE.current.chosenSide = side;
  $('#opt-L').classList.toggle('sel', side==='L');
  $('#opt-R').classList.toggle('sel', side==='R');
  gateNext();
}
function gateNext(){
  const btn=$('#btn-trial-next');
  const minMs=(STATE.minAnswerSec||0)*1000;
  if(STATE.gateTimer){ clearInterval(STATE.gateTimer); STATE.gateTimer=null; }
  const elapsed=performance.now()-STATE.shownAt;
  if(elapsed>=minMs){ btn.disabled=false; btn.textContent='下一題'; return; }
  btn.disabled=true;
  const tick=()=>{ const left=Math.ceil((minMs-(performance.now()-STATE.shownAt))/1000);
    if(left<=0){ clearInterval(STATE.gateTimer); STATE.gateTimer=null; btn.disabled=false; btn.textContent='下一題'; }
    else btn.textContent=`請再看一下…（${left}）`; };
  tick(); STATE.gateTimer=setInterval(tick,200);
}
$('#opt-L').onclick=()=>choose('L');
$('#opt-R').onclick=()=>choose('R');

$('#btn-trial-next').onclick=()=>{
  if($('#btn-trial-next').disabled) return;
  if(STATE.gateTimer){ clearInterval(STATE.gateTimer); STATE.gateTimer=null; }
  const c=STATE.current, now=new Date().toISOString();
  const rtMs=Math.round(performance.now()-STATE.shownAt);
  const chosenName = c.chosenSide==='L'?c.nameA:c.nameB;
  const outletKey = c.outlet?c.outlet.key:null;
  if(c.kind==='trap'){
    c.passed=(c.chosenSide===c.expectSide);
    STATE.traps.push({ task:c.task, side:c.chosenSide, expectSide:c.expectSide, passed:c.passed, rtMs, t:now });
  } else if(c.kind==='dominance'){
    // dominance holdout 僅對「繼續閱讀」(read，正向，有客觀正解=選資歷全優卡)做 pass 判定。
    // 第二個 DV「不受市場利益影響」為探索性、無客觀正解 → 不判 pass（passed=null），僅記錄選擇。
    const exploratory = (TASKS[c.task] && TASKS[c.task].exploratory);
    c.passed = exploratory ? null : (c.chosenSide===c.winSide);
    STATE.traps.push({ kind:'dominance', task:c.task, side:c.chosenSide, winSide:c.winSide, passed:c.passed, rtMs, t:now });
    STATE.responses.push({ kind:'dominance', task:c.task, trial:'dom', A:c.A, B:c.B, side:c.chosenSide, chosenName, outlet:outletKey, rtMs, t:now });
  } else if(c.kind==='repeat'){
    const orig=STATE.responses.find(r=>r.kind==='trial'&&r.task===c.task&&r.trial===c.ofTrial);
    const consistent = orig ? (origChosenName(orig)===chosenName) : null;
    c.consistent=consistent;
    STATE.repeats.push({ task:c.task, ofTrial:c.ofTrial, origName:orig?origChosenName(orig):null, againName:chosenName, side:c.chosenSide, consistent, rtMs, t:now });
  } else {
    // credVar/awardVar：措辭長度版本索引（0=最長…）。存檔供「措辭變體是否影響選擇」事後檢定
    // （使用者 2026-07-17：優先保長度等長、變體影響改事後檢定；版本不進設計矩陣但須可稽核）。
    STATE.responses.push({ kind:'trial', task:c.task, trial:c.trial, lenGroup:c.lenGroup, A:c.A, B:c.B,
      nameA:c.nameA, nameB:c.nameB, side:c.chosenSide, chosenName, outlet:outletKey, rtMs, t:now,
      credVarA:c.A.credVar, credVarB:c.B.credVar, awardVarA:c.A.awardVar, awardVarB:c.B.awardVar,
      bodyLenA:buildSentenceBody(c.A, STATE.chunkOrder, c.A.credVar, c.A.awardVar).length,
      bodyLenB:buildSentenceBody(c.B, STATE.chunkOrder, c.B.credVar, c.B.awardVar).length });
  }
  STATE.seqIdx++;
  if(STATE.seqIdx<STATE.seq.length){ gotoCurrentOrTaskIntro(); return; }
  showSurvey();
};
function origChosenName(orig){ return orig.side==='L'?orig.nameA:orig.nameB; }

/* ---- 量表 ----
 * 兩構面（對新聞普遍信任 + 是否在意記者資格，皆問受訪者自身傾向、永遠有對象）+ marker，全域亂序。
 * between-subject：受訪者整份固定一家媒體，outlet 既有信任題只問「被分到的那一家」（如「我相信中央社」）。
 */
function buildSurveyItems(){
  const flat=[];
  [SCALE_NEWSTRUST, SCALE_CREDLOOK, MARKER].forEach(g=>{
    g.items.forEach(it=>{
      flat.push({ group:g.group, prefix:g.prefix, id:it.id, scale:g.scale, q: it.q });
    });
  });
  // outlet 既有信任：只問受訪者被分到的那一家
  const o = STATE.outlet;
  SCALE_OUTLET.items.forEach(it=>{
    flat.push({ group:'outlet', prefix:SCALE_OUTLET.prefix, id:it.id, scale:SCALE_OUTLET.scale,
      q: it.q.replaceAll('{OUTLET}', o.name) });
  });
  return { items: shuffle(flat) };
}
let SURVEY_ITEMS=[];
function showSurvey(){
  const built=buildSurveyItems();
  SURVEY_ITEMS=built.items;
  const f=$('#survey-form'); f.innerHTML='';
  // 構念題（已亂序）
  SURVEY_ITEMS.forEach(item=>{
    const div=document.createElement('div'); div.className='field';
    const name=item.prefix+item.id;
    div.innerHTML=`<label>${item.q}</label>`+
      `<div class="scale" data-sid="${name}">`+
      item.scale.map((_,i)=>`<label><input type="radio" name="${name}" value="${i+1}"><span class="dot">${i+1}</span></label>`).join('')+
      `</div><div class="ends"><span>${item.scale[0]}</span><span>${item.scale[item.scale.length-1]}</span></div>`;
    f.appendChild(div);
  });
  // demographics
  const dh=document.createElement('div'); dh.className='grp-intro'; dh.textContent='基本資料'; f.appendChild(dh);
  DEMOG.forEach(item=>{
    const div=document.createElement('div'); div.className='field';
    const name='d_'+item.id;
    div.innerHTML=`<label>${item.q}</label>`+
      `<div class="opts" data-sid="${name}">`+
      item.options.map(o=>`<label><input type="radio" name="${name}" value="${o}"><span>${o}</span></label>`).join('')+
      `</div>`;
    f.appendChild(div);
  });
  show('#screen-survey');
}
$('#survey-form').addEventListener('change', e=>{
  if(e.target.name) STATE.survey[e.target.name]=e.target.value;
  const needScale = SURVEY_ITEMS.map(it=>it.prefix+it.id);
  const needDemog = DEMOG.map(it=>'d_'+it.id);
  const all = needScale.concat(needDemog).every(k=>STATE.survey[k]!=null);
  $('#btn-survey-next').disabled=!all;
});
$('#btn-survey-next').onclick=finish;

/* ---- payload / flatten ---- */
function payload(){
  const trialResp = STATE.responses.filter(r=>r.kind==='trial');
  const sideCounts={L:0,R:0}; trialResp.forEach(r=>{ if(r.side) sideCounts[r.side]++; });
  const nTrial=trialResp.length;
  const leftRatio=nTrial?+(sideCounts.L/nTrial).toFixed(3):null;
  // 各任務 dominance 是否通過
  const domPass={};
  STATE.traps.filter(t=>t.kind==='dominance').forEach(t=>{ domPass[t.task]=t.passed; });
  return {
    pid:STATE.pid, startedAt:STATE.startedAt, finishedAt:new Date().toISOString(),
    outlet:STATE.outlet?STATE.outlet.key:null, outletName:STATE.outlet?STATE.outlet.name:null,
    taskOrder:STATE.taskOrder,
    chunkOrder:STATE.chunkOrder, nTrialsPerTask:STATE.nTrialsPerTask, minAnswerSec:STATE.minAnswerSec,
    ua:navigator.userAgent,
    responses:STATE.responses, traps:STATE.traps, repeats:STATE.repeats, survey:STATE.survey,
    quality:{ sideCounts, leftRatio, nTrial, dominance_pass:domPass },
  };
}
// 布林 → 1/0/''（SheetMonkey/Google Sheet 會把 false 吞成空值，前人 2026-06-07 已驗證須轉）
const b01 = v => v===true?1 : v===false?0 : '';
function flatten(data){
  const flat={
    pid:data.pid, startedAt:data.startedAt, finishedAt:data.finishedAt,
    outlet:data.outlet, outletName:data.outletName,
    taskOrder:(data.taskOrder||[]).join('>'),
    chunkOrder:(data.chunkOrder||[]).join('>'),
    nTrialsPerTask:data.nTrialsPerTask, minAnswerSec:data.minAnswerSec,
    leftRatio:data.quality?data.quality.leftRatio:'',
    dominance_pass_read:data.quality?b01(data.quality.dominance_pass.read):'',
    dominance_pass_wary:data.quality?b01(data.quality.dominance_pass.wary):'',
    ua:data.ua||'',
  };
  // 每題：<task>_t{n}_<attr>A/B + 媒體 + 選擇（task ∈ read/wary）
  // 另存措辭版本(credVar/awardVar)與實際字長(bodyLen)供「措辭變體/長度是否影響選擇」事後檢定。
  data.responses.filter(r=>r.kind==='trial').forEach(r=>{
    const b=r.task+'_t'+(r.trial+1);
    ATTR_KEYS.forEach(k=>{ flat[b+'_'+k+'A']=r.A[k]; flat[b+'_'+k+'B']=r.B[k]; });
    flat[b+'_lenGroup']=r.lenGroup||''; flat[b+'_outlet']=r.outlet; flat[b+'_side']=r.side; flat[b+'_chosen']=r.chosenName; flat[b+'_rtMs']=r.rtMs;
    // 措辭變體事後檢定用欄位（null → 空字串，避免 Sheet 吞值）
    flat[b+'_credVarA']=r.credVarA==null?'':r.credVarA; flat[b+'_credVarB']=r.credVarB==null?'':r.credVarB;
    flat[b+'_awardVarA']=r.awardVarA==null?'':r.awardVarA; flat[b+'_awardVarB']=r.awardVarB==null?'':r.awardVarB;
    flat[b+'_bodyLenA']=r.bodyLenA; flat[b+'_bodyLenB']=r.bodyLenB;
  });
  // dominance（各任務一題）
  data.responses.filter(r=>r.kind==='dominance').forEach(dom=>{
    const b=dom.task+'_dom';
    ATTR_KEYS.forEach(k=>{ flat[b+'_'+k+'A']=dom.A[k]; flat[b+'_'+k+'B']=dom.B[k]; });
    flat[b+'_outlet']=dom.outlet; flat[b+'_side']=dom.side; flat[b+'_rtMs']=dom.rtMs;
  });
  // trap（各任務一題）
  data.traps.filter(t=>!t.kind).forEach(trap=>{
    const b='trap_'+trap.task;
    flat[b+'_side']=trap.side; flat[b+'_expect']=trap.expectSide; flat[b+'_pass']=b01(trap.passed); flat[b+'_rtMs']=trap.rtMs;
  });
  // repeat（各任務一題）
  (data.repeats||[]).forEach(r=>{ const b='rep_'+r.task;
    flat[b+'_of']=r.ofTrial; flat[b+'_orig']=r.origName; flat[b+'_again']=r.againName; flat[b+'_consistent']=b01(r.consistent); flat[b+'_rtMs']=r.rtMs; });
  // 量表（key 已含 group 前綴）
  Object.keys(data.survey||{}).forEach(k=>{ flat[k]=data.survey[k]; });
  return flat;
}
function finish(){
  const data=payload(); const flat=flatten(data);
  const json=JSON.stringify(flat,null,2);   // 保留供上傳失敗時下載備份
  show('#screen-done');
  if(STATE.endpoint){
    $('#done-msg').textContent='資料上傳中…';
    fetch(STATE.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(flat)})
      .then(()=>{ $('#done-msg').textContent='✓ 資料已送出，感謝你的填答！'; })
      .catch(err=>{ $('#done-msg').textContent='⚠ 上傳失敗，請改用下方下載備份：'+err; addDownload(json); });
  } else { $('#done-msg').textContent='未設定回傳網址 → 請下載 JSON 備份。'; addDownload(json); }
}
function addDownload(json){
  const a=document.createElement('a'); a.className='btn'; a.textContent='下載作答 JSON';
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=STATE.pid+'.json';
  $('#done-actions').innerHTML=''; $('#done-actions').appendChild(a);
}
</script>
</body>
